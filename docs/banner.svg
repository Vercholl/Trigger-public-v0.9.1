  </defs>

  <rect width="1200" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="1046" cy="48" r="150" fill="#10b981" opacity="0.06"/>
  <circle cx="1150" cy="256" r="100" fill="#34d399" opacity="0.05"/>
  <circle cx="620" cy="312" r="130" fill="#10b981" opacity="0.04"/>

